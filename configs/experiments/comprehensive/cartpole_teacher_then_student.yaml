# Strategy 6: Teacher Bootstrap then Switch

experiment:
  name: "cartpole_teacher_then_student"
  seed: 42
  device: "cpu"

environment:
  env_id: "CartPole-v1"
  num_envs: 8

algorithm:
  name: "ppo"
  learning_rate: 3e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

scheduler:
  name: "teacher_then_student"
  switch_timestep: 100000  # Switch after 100k timesteps

teacher:
  name: "optimal"

training:
  total_timesteps: 200000
  eval_freq: 10000
  checkpoint_freq: 50000
  save_freq: 100000

paths:
  log_dir: "logs/comprehensive/cartpole_teacher_then_student"
  checkpoint_dir: "logs/comprehensive/cartpole_teacher_then_student/checkpoints"
  results_dir: "logs/comprehensive/cartpole_teacher_then_student/results"

tracker:
  backends: ["tensorboard", "csv"]
  tensorboard:
    enabled: true
  csv:
    enabled: true
  console:
    enabled: false