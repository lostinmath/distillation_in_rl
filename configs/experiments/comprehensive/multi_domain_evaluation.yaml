# Comprehensive multi-domain evaluation experiment
# Tests adaptive scheduling across all major RL domains

experiment_name: "multi_domain_comprehensive"
description: "Comprehensive evaluation across discrete/continuous, visual/vector, locomotion/manipulation domains"

# Use existing algorithm config
algorithm: "ppo"

# Test environments from each domain
environments:
  # Classic discrete control
  - name: "cartpole"
    _target_: gym.make
    id: "CartPole-v1"

  # Visual discrete control (Atari)
  - name: "atari_breakout"
    _target_: adaptive_rl.envs.atari_wrapper.create_atari_env
    env_name: "breakout"
    obs_type: "rgb"
    frame_stack: 4

  # Continuous locomotion (dm_control)
  - name: "cheetah_run"
    _target_: adaptive_rl.envs.dm_control_wrapper.create_dm_control_env
    env_name: "cheetah_run"

  # Manipulation (MetaWorld)
  - name: "metaworld_reach"
    _target_: adaptive_rl.envs.metaworld_wrapper.create_metaworld_env
    task_name: "reach"

  # Robotics locomotion (PyBullet)
  - name: "pybullet_ant"
    _target_: adaptive_rl.envs.pybullet_wrapper.create_pybullet_env
    env_name: "ant"

  # Classic continuous control (MuJoCo)
  - name: "mujoco_halfcheetah"
    _target_: adaptive_rl.envs.mujoco_wrapper.create_mujoco_env
    env_name: "halfcheetah"

# Teachers for each environment
teachers:
  cartpole:
    _target_: adaptive_rl.teachers.optimal.create_optimal_teacher
    env_id: "CartPole-v1"

  atari_breakout:
    _target_: adaptive_rl.teachers.atari_teachers.create_atari_teacher
    env_name: "breakout"

  cheetah_run:
    _target_: adaptive_rl.teachers.dm_control_teachers.create_dm_control_teacher
    env_name: "cheetah_run"

  metaworld_reach:
    _target_: adaptive_rl.teachers.metaworld_teachers.create_metaworld_teacher
    task_name: "reach"

  pybullet_ant:
    _target_: adaptive_rl.teachers.pybullet_teachers.create_pybullet_teacher
    env_name: "ant"

  mujoco_halfcheetah:
    _target_: adaptive_rl.teachers.mujoco_teachers.create_mujoco_teacher
    env_name: "halfcheetah"

# Test all scheduling strategies
schedulers:
  - name: "student_only"
    _target_: adaptive_rl.schedulers.simple.StudentOnlyScheduler

  - name: "teacher_only"
    _target_: adaptive_rl.schedulers.simple.TeacherOnlyScheduler

  - name: "reward_based"
    _target_: adaptive_rl.schedulers.reward_based.RewardBasedScheduler
    trust_period: 5

  - name: "epsilon_05"
    _target_: adaptive_rl.schedulers.epsilon.EpsilonScheduler
    epsilon: 0.5

  - name: "epsilon_decreasing"
    _target_: adaptive_rl.schedulers.epsilon.EpsilonDecreasingScheduler
    epsilon_start: 0.8
    epsilon_end: 0.1
    decay_steps: 50000

# Training settings
training:
  total_steps: 100000  # Longer for comprehensive evaluation
  eval_episodes: 5
  save_interval: 10000

# Statistical evaluation
statistical:
  num_seeds: 5
  confidence_level: 0.95

# Tracking
tracker:
  _target_: adaptive_rl.trackers.comprehensive_tracker.ComprehensiveTracker
  log_dir: "logs/multi_domain_comprehensive"

# Seeds for reproducibility
seeds: [42, 123, 456, 789, 101112]