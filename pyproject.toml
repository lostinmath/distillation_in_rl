[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octoplus"
version = "1.1.0"
description = "Making training RL faster with distillation"
authors = [
    {name = "Margarita Piscenco", email = "piscenko@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
maniskill = [
    "mani-skill>=3.0.0b21",
]
dmcontrol = [
    # Add DeepMind Control Suite dependencies here
]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/octoplus",
    "src/octoplus_maniskill",
    "src/octoplus_dmcontrol",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=octoplus --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src/octoplus"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
