# @package _global_

defaults:
  - _self_
  - algorithm: ppo
  - environment: cartpole
  - scheduler: student_only
  - teacher: optimal
  - tracker: tensorboard
  - hydra: default

experiment:
  name: ${scheduler.name}_${environment.name}
  seed: 42
  device: cuda
  num_seeds: 3

training:
  total_timesteps: 100000
  eval_freq: 10000
  checkpoint_freq: 50000
  video_freq: 0

paths:
  log_dir: logs/${experiment.name}
  checkpoint_dir: ${paths.log_dir}/checkpoints
  video_dir: ${paths.log_dir}/videos
