# Strategy 4: Decreasing Epsilon (Teacher fade-out)

experiment:
  name: "cartpole_epsilon_decreasing"
  seed: 42
  device: "cpu"

environment:
  env_id: "CartPole-v1"
  num_envs: 8

algorithm:
  name: "ppo"
  learning_rate: 5e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

scheduler:
  name: "epsilon_decreasing"
  epsilon_start: 0.9
  epsilon_end: 0.1
  epsilon_decay_steps: 100000

teacher:
  name: "optimal"

training:
  total_timesteps: 150000
  eval_freq: 10000
  checkpoint_freq: 50000
  save_freq: 100000

paths:
  log_dir: "logs/comprehensive/cartpole_epsilon_decreasing"
  checkpoint_dir: "logs/comprehensive/cartpole_epsilon_decreasing/checkpoints"
  results_dir: "logs/comprehensive/cartpole_epsilon_decreasing/results"

tracker:
  backends: ["tensorboard", "csv"]
  tensorboard:
    enabled: true
  csv:
    enabled: true
  console:
    enabled: false