# Strategy 7: Reward-Based (MAIN CONTRIBUTION - Adaptive switching)

experiment:
  name: "cartpole_reward_based"
  seed: 42
  device: "cpu"

environment:
  env_id: "CartPole-v1"
  num_envs: 8

algorithm:
  name: "ppo"
  learning_rate: 5e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

scheduler:
  name: "reward_based"
  trust_period: 12
  performance_window: 3

teacher:
  name: "optimal"

training:
  total_timesteps: 150000
  eval_freq: 10000
  checkpoint_freq: 50000
  save_freq: 100000

paths:
  log_dir: "logs/comprehensive/cartpole_reward_based"
  checkpoint_dir: "logs/comprehensive/cartpole_reward_based/checkpoints"
  results_dir: "logs/comprehensive/cartpole_reward_based/results"

tracker:
  backends: ["tensorboard", "csv"]
  tensorboard:
    enabled: true
  csv:
    enabled: true
  console:
    enabled: false