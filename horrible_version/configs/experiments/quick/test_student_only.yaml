# Quick test for student_only strategy

experiment:
  name: "quick_test_student_only"
  seed: 42
  device: "cpu"

environment:
  env_id: "CartPole-v1"
  num_envs: 4

algorithm:
  name: "ppo"
  learning_rate: 3e-4
  n_steps: 128
  batch_size: 32
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

scheduler:
  name: "student_only"

teacher: null

training:
  total_timesteps: 5000
  eval_freq: 2000
  checkpoint_freq: 5000
  save_freq: 5000

paths:
  log_dir: "logs/strategy_test/student_only"
  checkpoint_dir: "logs/strategy_test/student_only/checkpoints"
  results_dir: "logs/strategy_test/student_only/results"

tracker:
  backends: ["console", "csv"]
  console:
    enabled: true
    verbose: false
  csv:
    enabled: true
