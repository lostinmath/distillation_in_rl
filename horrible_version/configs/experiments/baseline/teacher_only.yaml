# Pure teacher guidance

experiment:
  name: "teacher_only_baseline"

environment:
  env_id: "CartPole-v1"
  num_envs: 8
  num_steps: 128

training:
  num_iterations: 500
  learning_rate: 2.5e-4

scheduler:
  strategy: "teacher_only"

teacher:
  type: "optimal"

tracker:
  backends: ["tensorboard", "csv"]