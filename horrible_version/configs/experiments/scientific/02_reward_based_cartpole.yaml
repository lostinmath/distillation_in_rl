# Scientific Experiment 2: Reward-Based Scheduling (MAIN CONTRIBUTION)
# Adaptive switching between teacher and student based on performance trends

experiment:
  name: "02_reward_based_cartpole"
  seed: 42
  device: "cpu"

environment:
  env_id: "CartPole-v1"
  num_envs: 8

algorithm:
  name: "ppo"
  learning_rate: 3e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

scheduler:
  name: "reward_based"
  trust_period: 5  # Key parameter from your research
  performance_window: 3

teacher:
  name: "optimal"

training:
  total_timesteps: 500000
  eval_freq: 10000
  checkpoint_freq: 50000
  save_freq: 100000

paths:
  log_dir: "logs/scientific/02_reward_based_cartpole"
  checkpoint_dir: "logs/scientific/02_reward_based_cartpole/checkpoints"
  results_dir: "logs/scientific/02_reward_based_cartpole/results"

tracker:
  backends: ["tensorboard", "csv", "console"]
  tensorboard:
    enabled: true
  csv:
    enabled: true
  console:
    enabled: true
    verbose: true