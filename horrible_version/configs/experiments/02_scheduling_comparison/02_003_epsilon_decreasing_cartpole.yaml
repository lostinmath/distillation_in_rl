# @package _global_
# Experiment 02.003: Epsilon decreasing scheduling - CartPole
# Group: 02 (Scheduling Comparison), Experiment: 003, Environment: CartPole

defaults:
  - base_experiment
  - environment: cartpole
  - algorithm: ppo
  - scheduler: epsilon_decreasing
  - teacher: optimal
  - tracker: tensorboard

experiment_id: "02_003"
experiment_name: "02_003_epsilon_decreasing_cartpole"
experiment_group: "02_scheduling_comparison"
experiment_description: "Linear decay from 100% to 0% teacher usage over training"

seed: 42
total_timesteps: 50000
eval_frequency: 5000

# Decreasing epsilon parameters
scheduler:
  start_epsilon: 1.0    # Start with 100% teacher
  end_epsilon: 0.0      # End with 0% teacher
  decay_steps: 40000    # Decay over 80% of training

# Same base hyperparameters
ppo:
  learning_rate: 3e-4
  n_steps: 2048
  batch_size: 64

logging:
  log_interval: 1000
  save_interval: 10000

tags:
  - baseline_scheduler
  - epsilon_decreasing
  - linear_decay
  - cartpole
  - group_02
  - exp_003