[project]
name = "adaptive-rl"
version = "1.0.0"
description = "Adaptive scheduling strategies for teacher-guided reinforcement learning"
authors = ["Margarita Piscenco <piscenko@gmail.com>"]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.10,<3.13"
pytorch = ">=2.0"
numpy = ">=1.26"
gymnasium = "*"
pyyaml = "*"
tqdm = "*"
matplotlib = "*"
pandas = "*"
seaborn = "*"
scikit-learn = "*"
mujoco = "*"
imageio = "*"
# Atari environments (will be installed via pypi)

[pypi-dependencies]
pydantic = ">=2.0"
hydra-core = ">=1.3"
omegaconf = ">=2.3"
rich = ">=13.0"
loguru = ">=0.7"
tyro = ">=0.9"
dm_control = "*"
shimmy = "*"
# Additional environment packages
metaworld = "*"
pybullet = "*"
ale-py = "*"
# Atari support handled via ale-py above
# Model versioning and logging
wandb = ">=0.16"
tensorboard = ">=2.12"
scipy = ">=1.10"

[feature.dev.dependencies]
black = "*"
ruff = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
mypy = "*"
pre-commit = "*"
ipython = "*"
jupyter = "*"
notebook = "*"

[feature.video.dependencies]
imageio = "*"
opencv = "*"

[feature.video.pypi-dependencies]
moviepy = "*"

[feature.tracking.pypi-dependencies]
mlflow = ">=2.8"
wandb = ">=0.15"
neptune = ">=1.8"

[tasks]
# Development tasks
test = "PYTHONPATH=src python tests/test_integration.py"
test-dm-control = "PYTHONPATH=src python tests/test_dm_control_integration.py"
test-environments = "PYTHONPATH=src python tests/test_all_environments.py"

# Experiment tasks
run-quick = "PYTHONPATH=src python scripts/run_overnight_experiments.py --mode quick"
run-robust = "PYTHONPATH=src python scripts/run_robust_experiments.py"
statistical-validation = "PYTHONPATH=src python examples/run_statistical_validation.py"

# Code quality
lint = "ruff check src/"
format = "black src/"
type-check = "mypy src/adaptive_rl"
quality = { depends-on = ["lint", "format", "type-check"] }

# Clean up
clean = "rm -rf logs/ results/ __pycache__/ .pytest_cache/ htmlcov/ .coverage"

[environments]
default = { features = ["dev"], solve-group = "default" }
minimal = { features = [], solve-group = "default" }
full = { features = ["dev", "video", "tracking"], solve-group = "default" }