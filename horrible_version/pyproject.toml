[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-rl"
version = "1.0.0"
description = "Adaptive scheduling strategies for teacher-guided reinforcement learning"
authors = [
    {name = "Margarita Piscenco", email = "piscenko@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "reinforcement-learning",
    "adaptive-scheduling",
    "teacher-student-learning",
    "policy-switching",
    "ppo",
]

dependencies = [
    "gymnasium[box2d-py]>=0.29.1",
    "torch>=2.8.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0.2",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "tqdm>=4.67.1",
    "tensorboard>=2.20.0",
    "matplotlib>=3.10.5",
    "pandas>=2.3.2",
    "seaborn>=0.13.2",
    "scikit-learn>=1.7.2",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "tyro>=0.9.32",
]

[project.optional-dependencies]
mlflow = [
    "mlflow>=2.8.0",
]
wandb = [
    "wandb>=0.15.0",
]
neptune = [
    "neptune>=1.8.0",
]
video = [
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.8",
    "opencv-python>=4.8.0",
    "moviepy>=1.0.3",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "ipython>=8.10.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
]
all = [
    "adaptive-rl[mlflow,wandb,neptune,video,dev]",
]

[project.scripts]
adaptive-train = "adaptive_rl.train:main"
adaptive-evaluate = "adaptive_rl.evaluate:main"
adaptive-analyze = "adaptive_rl.analysis.analyze:main"

[project.urls]
Homepage = "https://github.com/lostinmath/adaptive_rl"
Repository = "https://github.com/lostinmath/adaptive_rl"
Documentation = "https://github.com/lostinmath/adaptive_rl#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_rl"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/configs",
    "/tests",
    "README.md",
    "LICENSE",
    "CLAUDE.md",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # numpy specific rules
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "RUF012",  # Mutable class attributes
    "TRY003",  # Long exception messages
    "PLW2901", # for loop variable overwritten
    "PLR2004", # Magic value used in comparison
    "PLC0415", # import should be at top-level
    "NPY002",  # Replace legacy numpy random
    "RUF013",  # PEP 484 prohibits implicit Optional
    "ARG001",  # Unused function argument
    "F841",    # Local variable assigned but never used
    "B904",    # Within except clause
    "PTH123",  # open() should be replaced by Path.open()
    "SIM105",  # Use contextlib.suppress
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "D", "PLR2004", "S101"]
"test_*.py" = ["ARG", "D", "PLR2004", "S101"]
"src/adaptive_rl/train.py" = ["PLR0912", "PLR0915"]  # Complex main functions are ok
"src/adaptive_rl/analysis/*" = ["PLR0912", "PLR0915", "C901"]  # Analysis can be complex

[tool.ruff.lint.isort]
known-first-party = ["adaptive_rl"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/adaptive_rl",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-n=auto",  # Use pytest-xdist for parallel testing
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src/adaptive_rl"]
omit = [
    "tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

